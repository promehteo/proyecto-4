name: Proteger gitignore (limpieza sin desincronizar)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  limpiar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR: ${{ github.event.pull_request.number }}
      # >>> AUTORES AUTOMATICOS (regex case-insensitive). Edita segun tu imagen.
      # Cubre qwen-intl, qwen-chat coder, github-actions[bot] y el bot de limpieza.
      AUTO_RE: "qwen|github-actions|gitignore-guard"
      # >>> NOMBRES DE RAMA automaticos (red secundaria). Edita si ves otros prefijos.
      HEAD_RE: "qwen|clean-pr-"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: true

      - name: Detectar si el PR toca .gitignore
        id: detect
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx '\.gitignore$'; then
            echo "toca=yes" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Detectar si el PR es automatico (por autor del commit head)
        id: autor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTOR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
                    --jq '.commit.author.name + " " + .commit.author.email' 2>/dev/null || echo '')
          HEADREF="${{ github.event.pull_request.head.ref }}"
          AUTO=no
          if printf '%s' "$AUTOR"  | grep -Eqi "$AUTO_RE"; then AUTO=yes; fi
          if printf '%s' "$HEADREF" | grep -Eqi "$HEAD_RE"; then AUTO=yes; fi
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          echo "Autor commit head: $AUTOR | rama head: $HEADREF => automatico=$AUTO"

      - name: Avisar (sin cerrar) si un PR humano toca .gitignore
        if: steps.detect.outputs.toca == 'yes' && steps.autor.outputs.auto == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --body "Este PR modifica \`.gitignore\`. Como es de un autor humano, NO se cierra automaticamente. Revisa si el cambio es intencional antes de mergear." || true

      - name: Construir rama limpia clean-pr-N (git puro)
        if: steps.detect.outputs.toca == 'yes' && steps.autor.outputs.auto == 'yes'
        run: |
          git config user.name  "gitignore-guard[bot]"
          git config user.email "gitignore-guard[bot]@users.noreply.github.com"
          BR="clean-pr-$PR"
          git checkout -B "$BR" "$BASE_SHA"
          git checkout "$HEAD_SHA" -- .          # trae TODO el PR al indice
          git checkout "$BASE_SHA" -- .gitignore # quita .gitignore del cambio
          if git diff --cached --quiet; then echo "Nada limpio que commitear."; exit 0; fi
          git commit -m "Cambios de #$PR sin .gitignore (limpieza automatica)"
          git push -f origin "$BR"               # SOLO a clean-pr-N, nunca a la rama de Qwen

      - name: Abrir o actualizar PR limpio
        if: steps.detect.outputs.toca == 'yes' && steps.autor.outputs.auto == 'yes'
        id: cpr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="clean-pr-$PR"
          EXISTE=$(gh pr list --head "$BR" --state open --json number -q '.[0].number')
          if [ -n "$EXISTE" ]; then echo "num=$EXISTE" >> "$GITHUB_OUTPUT"; echo "PR limpio ya abierto: #$EXISTE";
          else
            URL=$(gh pr create --base "$BASE_REF" --head "$BR" \
              --title "Limpio: cambios de #$PR sin .gitignore" \
              --body "Copia automatica de #$PR con \`.gitignore\` restaurado. **Mergea este**; el original se cierra solo." \
              --label auto-clean 2>&1) || true
            echo "$URL"; echo "num=$(echo "$URL" | grep -oE '[0-9]+$' | tail -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cerrar el PR original
        if: steps.detect.outputs.toca == 'yes' && steps.autor.outputs.auto == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMPIO="${{ steps.cpr.outputs.num }}"
          gh pr close "$PR" --comment "Cerrado automaticamente: modificaba \`.gitignore\` (autor automatico). Version limpia en #${LIMPIO:-clean-pr-$PR}. Mergea esa." || true
