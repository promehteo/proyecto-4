name: Proteger gitignore (guard)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Falla si el PR modifica .gitignore
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qx '\.gitignore$'; then
            echo "::error::Este PR modifica .gitignore, lo cual esta prohibido."
            echo "Quita .gitignore de los cambios del PR y vuelve a publicar."
            exit 1
          fi
          echo "OK: el PR no modifica .gitignore."
